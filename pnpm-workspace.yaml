allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true
catalogMode: prefer
minimumReleaseAgeExclude:
  - '@types/node@25.9.0'
  - astro@7.2.1

shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
packages:
  - docs
  - packages/*
catalogs:
  build:
    tsdown: ^0.22.14
  ci:
    publint: ^0.3.24
  cli:
    yargs: ^18.1.0
  dev:
    '@antfu/eslint-config': ^9.5.0
    '@antfu/ni': ^30.5.0
    '@types/smtp-server': ^3.5.13
    '@vitest/coverage-v8': ^4.1.11
    bumpp: ^12.2.2
    eslint: ^10.9.1
    eslint-plugin-format: ^2.0.1
    lint-staged: ^17.4.1
    simple-git-hooks: ^2.14.0
    smtp-server: ^3.19.6
    taze: ^20.0.2
    typescript: ^6.0.3
    vitest: ^4.1.11
  docs:
    '@astrojs/check': ^0.9.10
    '@astrojs/starlight': ^0.41.11
    astro: ^7.2.10
    sharp: ^0.35.4
    starlight-links-validator: ^0.26.0
    starlight-sidebar-topics: ^0.8.0
    starlight-theme-rapide: ^0.5.2
  lib:
    defu: ^6.1.7
    emailjs: ^5.0.3
    ofetch: ^1.5.1
    ufo: ^1.6.4
    valibot: ^1.4.2
  types:
    '@types/node': ^26.4.1
    '@types/yargs': ^17.0.35
