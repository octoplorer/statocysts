catalogMode: prefer

minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3

shellEmulator: true

packages:
  - docs
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true

catalogs:
  build:
    tsdown: ^0.23.1
  ci:
    publint: ^0.3.25
  cli:
    yargs: ^18.2.0
  dev:
    '@antfu/eslint-config': ^10.0.0
    '@antfu/ni': ^30.6.0
    '@types/smtp-server': ^3.5.13
    '@vitest/coverage-v8': ^5.0.3
    bumpp: ^12.3.0
    eslint: ^10.12.0
    eslint-plugin-format: ^2.0.1
    lint-staged: ^17.6.0
    simple-git-hooks: ^2.14.0
    smtp-server: ^3.19.21
    taze: ^21.3.0
    typescript: ^6.0.3
    vitest: ^5.0.3
  docs:
    '@astrojs/check': ^0.9.10
    '@astrojs/starlight': ^0.42.6
    astro: ^7.3.8
    sharp: ^0.35.5
    starlight-links-validator: ^0.27.0
    starlight-sidebar-topics: ^0.9.0
    starlight-theme-rapide: ^0.6.0
  lib:
    defu: ^6.1.7
    emailjs: ^5.0.3
    ofetch: ^1.5.1
    ufo: ^1.6.4
    valibot: ^1.5.0
  types:
    '@types/node': ^26.6.5
    '@types/yargs': ^17.0.35
