catalogMode: prefer

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@types/node@25.9.0'
  - astro@7.2.1

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3

shellEmulator: true

packages:
  - docs
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true

catalogs:
  build:
    tsdown: ^0.23.0
  ci:
    publint: ^0.3.24
  cli:
    yargs: ^18.1.0
  dev:
    '@antfu/eslint-config': ^9.5.1
    '@antfu/ni': ^30.5.0
    '@types/smtp-server': ^3.5.13
    '@vitest/coverage-v8': ^5.0.0
    bumpp: ^12.3.0
    eslint: ^10.10.0
    eslint-plugin-format: ^2.0.1
    lint-staged: ^17.5.0
    simple-git-hooks: ^2.14.0
    smtp-server: ^3.19.7
    taze: ^21.1.0
    typescript: ^7.0.0
    vitest: ^5.0.0
  docs:
    '@astrojs/check': ^0.9.10
    '@astrojs/starlight': ^0.42.0
    astro: ^7.3.1
    sharp: ^0.35.4
    starlight-links-validator: ^0.26.0
    starlight-sidebar-topics: ^0.9.0
    starlight-theme-rapide: ^0.6.0
  lib:
    defu: ^6.1.7
    emailjs: ^5.0.3
    ofetch: ^1.5.1
    ufo: ^1.6.4
    valibot: ^1.4.2
  types:
    '@types/node': ^26.4.1
    '@types/yargs': ^17.0.35
