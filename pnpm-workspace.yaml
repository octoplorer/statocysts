allowBuilds:
  esbuild: true
  sharp: true
  simple-git-hooks: true
catalogMode: prefer
minimumReleaseAgeExclude:
  - '@types/node@25.9.0'
  - astro@7.2.1

shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - chokidar@4.0.3
packages:
  - docs
  - packages/*
catalogs:
  build:
    tsdown: ^0.22.14
  ci:
    publint: ^0.3.23
  cli:
    yargs: ^18.1.0
  dev:
    '@antfu/eslint-config': ^9.3.0
    '@antfu/ni': ^30.5.0
    '@types/smtp-server': ^3.5.13
    '@vitest/coverage-v8': ^4.1.10
    bumpp: ^12.2.0
    eslint: ^10.8.1
    eslint-plugin-format: ^2.0.1
    lint-staged: ^17.3.0
    simple-git-hooks: ^2.13.1
    smtp-server: ^3.19.3
    taze: ^20.0.1
    typescript: ^6.0.3
    vitest: ^4.1.10
  docs:
    '@astrojs/check': ^0.9.10
    '@astrojs/starlight': ^0.41.7
    astro: ^7.2.1
    sharp: ^0.35.3
  lib:
    defu: ^6.1.7
    emailjs: ^5.0.2
    ofetch: ^1.5.1
    ufo: ^1.6.4
    valibot: ^1.4.2
  types:
    '@types/node': ^26.2.0
    '@types/yargs': ^17.0.35
